[build]
  command = "npm --prefix frontend run build"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_API_URL = "https://manthusa-tvs.onrender.com"
  BACKEND_URL = "https://manthusa-tvs.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "https://manthusa-tvs.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://manthusa-tvs.onrender.com/uploads/:splat"
  status = 200
  force = true
